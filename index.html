<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sunta — GFX</title>
  <meta name="description" content="Sunta — Roblox GFX portfolio.">
  <style>
    :root {
      --bg: #08080a;
      --panel: #111114;
      --text: #f3f3f3;
      --muted: #9a9a9f;
      --line: #242428;
    }

    * { box-sizing: border-box; }

    html {
      scroll-behavior: smooth;
      background: var(--bg);
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at 50% -10%, rgba(80,160,255,.20), transparent 34%),
        radial-gradient(circle at 8% 28%, rgba(25,105,255,.16), transparent 30%),
        radial-gradient(circle at 92% 72%, rgba(0,210,255,.12), transparent 32%),
        linear-gradient(135deg, #050b18 0%, #07142a 48%, #050a15 100%);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      overflow-x: hidden;
    }

    /* Subtle moving atmosphere behind the portfolio */
    body::before,
    body::after {
      content: "";
      position: fixed;
      z-index: -2;
      width: 42vw;
      height: 42vw;
      max-width: 620px;
      max-height: 620px;
      border-radius: 50%;
      pointer-events: none;
      filter: blur(90px);
      opacity: .18;
      animation: drift 16s ease-in-out infinite alternate;
    }

    body::before {
      top: -18vw;
      left: -12vw;
      background: rgba(25, 105, 255, .48);
    }

    body::after {
      right: -14vw;
      bottom: -18vw;
      background: rgba(0, 185, 255, .34);
      animation-delay: -7s;
      animation-duration: 20s;
    }

    /* Fine animated grain/grid so the background has some life without
       competing with the GFX itself. */
    body > * {
      position: relative;
    }

    body::marker { display: none; }

    body > header::after {
      content: "";
      position: absolute;
      z-index: -1;
      top: 15%;
      left: -25%;
      width: 150%;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(70,170,255,.0), rgba(70,170,255,.32), rgba(70,170,255,.0), transparent);
      filter: blur(1px);
      transform: rotate(-9deg);
      animation: streak 9s ease-in-out infinite;
      pointer-events: none;
    }

    .bg-grid {
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      opacity: .16;
      background-image:
        linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px);
      background-size: 54px 54px;
      mask-image: linear-gradient(to bottom, black, transparent 78%);
      animation: gridMove 24s linear infinite;
    }

    .wrap {
      width: min(1120px, calc(100% - 32px));
      margin: 0 auto;
    }

    header {
      position: relative;
      padding: 64px 0 42px;
      border-bottom: 1px solid var(--line);
      isolation: isolate;
    }

    header::before {
      content: "";
      position: absolute;
      left: 50%;
      top: 8px;
      width: 180px;
      height: 1px;
      transform: translateX(-50%);
      background: linear-gradient(90deg, transparent, rgba(255,255,255,.5), transparent);
      animation: pulseLine 3.5s ease-in-out infinite;
    }

    .profile {
      display: flex;
      align-items: center;
      gap: 22px;
    }

    .pfp {
      width: 112px;
      height: 112px;
      flex: 0 0 112px;
      border-radius: 50%;
      object-fit: cover;
      display: block;
      border: 1px solid #333339;
      box-shadow:
        0 0 0 6px rgba(255,255,255,.018),
        0 12px 45px rgba(0,0,0,.4);
      transition: transform .35s ease, box-shadow .35s ease;
    }

    .pfp:hover {
      transform: translateY(-3px);
      box-shadow:
        0 0 0 7px rgba(255,255,255,.025),
        0 16px 55px rgba(0,0,0,.55);
    }

    h1 {
      margin: 0 0 7px;
      font-size: clamp(30px, 5vw, 46px);
      line-height: 1;
      letter-spacing: -0.04em;
    }

    .bio {
      max-width: 650px;
      margin: 0;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.65;
    }

    main {
      padding: 42px 0 80px;
    }

    .section-title {
      margin: 0 0 22px;
      font-size: 14px;
      font-weight: 650;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: #c8c8cc;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px;
      align-items: start;
    }

    .design {
      margin: 0;
      overflow: hidden;
      border-radius: 10px;
      background: var(--panel);
      border: 1px solid var(--line);
      box-shadow: 0 16px 45px rgba(0,0,0,.16);
    }

    .design img {
      width: 100%;
      height: auto;
      display: block;
      transition: transform .35s ease, filter .35s ease;
    }

    .design:hover img {
      transform: scale(1.012);
      filter: brightness(1.035);
    }

    footer {
      border-top: 1px solid var(--line);
      padding: 24px 0 38px;
      color: #68686d;
      font-size: 12px;
    }

    @keyframes drift {
      from { transform: translate3d(-3%, -2%, 0) scale(1); }
      to   { transform: translate3d(8%, 7%, 0) scale(1.08); }
    }

    @keyframes gridMove {
      from { background-position: 0 0, 0 0; }
      to   { background-position: 0 54px, 54px 0; }
    }

    @keyframes pulseLine {
      0%, 100% { opacity: .25; width: 130px; }
      50% { opacity: .7; width: 220px; }
    }

    @keyframes streak {
      0%, 100% { transform: translateX(-12%) rotate(-9deg); opacity: 0; }
      20% { opacity: .15; }
      50% { transform: translateX(12%) rotate(-9deg); opacity: .55; }
      80% { opacity: .12; }
    }

    @media (prefers-reduced-motion: reduce) {
      body::before,
      body::after,
      .bg-grid,
      header::before,
      body > header::after {
        animation: none;
      }
    }

    @media (max-width: 700px) {
      header { padding-top: 38px; }
      .profile { align-items: flex-start; }
      .pfp { width: 82px; height: 82px; flex-basis: 82px; }
      .gallery { grid-template-columns: 1fr; gap: 14px; }
      .wrap { width: min(100% - 22px, 1120px); }
    }
  </style>
</head>
<body>
  <div class="bg-grid" aria-hidden="true"></div>
  <header>
    <div class="wrap profile">
      <img class="pfp" src="profile.png" alt="Sunta profile picture">
      <div>
        <h1>Sunta</h1>
        <p class="bio">I create roblox gfx, and i would like to please my customers, and become one of the best.</p>
      </div>
    </div>
  </header>

  <main class="wrap">
    <h2 class="section-title">Designs</h2>
<section class="gallery">
    <figure class="design"><img src="design-01.png" alt="Sunta GFX design 01" loading="lazy"></figure>
    <figure class="design"><img src="design-02.png" alt="Sunta GFX design 02" loading="lazy"></figure>
    <figure class="design"><img src="design-03.png" alt="Sunta GFX design 03" loading="lazy"></figure>
    <figure class="design"><img src="design-04.png" alt="Sunta GFX design 04" loading="lazy"></figure>
    <figure class="design"><img src="design-05.png" alt="Sunta GFX design 05" loading="lazy"></figure>
    <figure class="design"><img src="design-06.png" alt="Sunta GFX design 06" loading="lazy"></figure>
    <figure class="design"><img src="design-07.png" alt="Sunta GFX design 07" loading="lazy"></figure>
    <figure class="design"><img src="design-08.png" alt="Sunta GFX design 08" loading="lazy"></figure>
    <figure class="design"><img src="design-09.png" alt="Sunta GFX design 09" loading="lazy"></figure>
    <figure class="design"><img src="design-10.png" alt="Sunta GFX design 10" loading="lazy"></figure>
</section>
  </main>

  <footer>
    <div class="wrap">Sunta GFX</div>
  </footer>
</body>
</html>
